timeout: 5
default_entry: NasuaOS 64-bit
interface_branding: NasuaOS

interface_help_hidden: yes

# Debug
verbose: yes

interface_resolution: 1280x720

wallpaper: boot():/boot/assets/images/background.png
wallpaper_style: stretched

/NasuaOS 32-bit
    protocol: multiboot
    path: boot():/boot/kernel_32bit
    textmode: yes
    comment: Basic console-only environment

/NasuaOS 64-bit
    protocol: limine
    path: boot():/boot/kernel_64bit
    resolution: 1280x720
    comment: Full operating system with graphical interface (recommended)

/Advanced Options
    //Safe mode 32-bit
        protocol: multiboot
        path: boot():/boot/kernel_32bit
        cmdline: safe_mode=yes
        comment: Boot into a 32bit safe mode environment for troubleshooting

    //Safe mode 64-bit
        protocol: limine
        path: boot():/boot/kernel_64bit
        cmdline: safe_mode=yes
        comment: Boot into a 64bit safe mode environment for troubleshooting

    // Utilities
        ///RAM Test
            protocol: multiboot
            path: boot():/boot/utils/memtest
            comment: Run RAM test utility

        ///UEFI Shell
            protocol: multiboot
            path: boot():/boot/utils/shell
            comment: Launch UEFI shell

        ///Hardware Detecion Tool
            protocol: multiboot
            path: boot():/boot/utils/hdt
            comment: Launch Hardware Detection Tool (HDT) to view system information

        ///Firmware UEFI Setup
            protocol: multiboot
            path: boot():/boot/utils/fwsetup
            comment: Launch UEFI firmware setup utility