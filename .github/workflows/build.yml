name: Build NasuaOS

on:
  push:
    branches:
      - main
    paths:
      - "kernel_32bit/**"
      - "kernel_64bit/**"
      - "utilities/**"
      - ".config/**"
      - "GNUmakefile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            curl \
            gcc \
            g++ \
            cmake \
            xorriso \
            clang \
            lld \
            nasm \
            mtools

      - name: Build ISO
        run: |
          make all

      - name: Build HDD image
        run: |
          make all-hdd

      - name: Find images
        run: |
          echo "Generated files:"
          find . \( -name "*.iso" -o -name "*.hdd" \) -type f

      - name: Prepare release files
        run: |
          mkdir release

          cp $(find . -name "*.iso" | head -n 1) release/NasuaOS.iso
          cp $(find . -name "*.hdd" | head -n 1) release/NasuaOS.hdd

          cd release

          printf "![Logo](https://raw.githubusercontent.com/Szatakis/NasuaOS/main/documentation/images/logo.png)\n\n" > release_notes.md
          printf "# NasuaOS Builds\n\n" >> release_notes.md
          printf "Prebuilt images are available for testing in QEMU, VirtualBox, or on real hardware.\n\n" >> release_notes.md

          printf "## Available Images\n\n" >> release_notes.md
          printf "| Image | Description |\n" >> release_notes.md
          printf "|-------|-------------|\n" >> release_notes.md
          printf "| **NasuaOS.iso** | Bootable ISO image for CD/DVD or USB media. Compatible with QEMU, VirtualBox, and real hardware. |\n" >> release_notes.md
          printf "| **NasuaOS.hdd** | Virtual hard disk image intended primarily for QEMU and other virtual machines. |\n\n" >> release_notes.md

          printf "## Running in QEMU\n\n" >> release_notes.md
          printf "\`\`\`bash\n" >> release_notes.md
          printf "qemu-system-x86_64 -hda NasuaOS.hdd\n" >> release_notes.md
          printf "\`\`\`\n\n" >> release_notes.md

          printf "## Booting the ISO\n\n" >> release_notes.md
          printf "\`\`\`bash\n" >> release_notes.md
          printf "qemu-system-x86_64 -cdrom NasuaOS.iso -boot d\n" >> release_notes.md
          printf "\`\`\`\n\n" >> release_notes.md

          printf "You can also write the ISO image to a USB flash drive and boot it on supported hardware.\n" >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NasuaOS Latest Build
          body_path: release/release_notes.md
          prerelease: true
          make_latest: true
          files: |
            release/NasuaOS.iso
            release/NasuaOS.hdd
