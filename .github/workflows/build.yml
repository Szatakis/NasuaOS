name: Build NasuaOS

on:
  push:
    branches:
      - main
    paths:
      - "kernel_32bit/**"
      - "kernel_64bit/**"
      - "source/**"
      - "utilities/**"
      - ".config/**"
      - "GNUmakefile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            curl \
            gcc \
            g++ \
            cmake \
            xorriso \
            clang \
            lld \
            nasm \
            mtools

      - name: Build ISO
        run: make all

      - name: Build HDD image
        run: make all-hdd

      - name: Find generated images
        run: |
          echo "Generated ISO files:"
          find . -type f -name "*.iso"

          echo "Generated HDD files:"
          find . -type f -name "*.hdd"

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p release

          ISO=$(find . -type f -name "*.iso" -not -path "./release/*" -print -quit)
          HDD=$(find . -type f -name "*.hdd" -not -path "./release/*" -print -quit)

          if [ -z "$ISO" ]; then
            echo "ERROR: ISO image was not generated!"
            exit 1
          fi

          if [ -z "$HDD" ]; then
            echo "ERROR: HDD image was not generated!"
            exit 1
          fi

          cp "$ISO" release/NasuaOS.iso
          cp "$HDD" release/NasuaOS.hdd

          cd release

          cat > release_notes.md <<'EOF'
          ![Logo](https://raw.githubusercontent.com/Szatakis/NasuaOS/main/documentation/images/logo.png)

          # NasuaOS Builds

          Prebuilt images are available for testing in QEMU, VirtualBox, or on real hardware.

          ## Available Images

          | Image | Description |
          |-------|-------------|
          | **NasuaOS.iso** | Bootable ISO image for CD/DVD or USB media. Compatible with QEMU, VirtualBox, and real hardware. |
          | **NasuaOS.hdd** | Virtual hard disk image intended primarily for QEMU and other virtual machines. |

          ## Running in QEMU

          ```bash
          qemu-system-x86_64 -hda NasuaOS.hdd
          ```

          ## Booting the ISO

          ```bash
          qemu-system-x86_64 -cdrom NasuaOS.iso -boot d
          ```

          You can also write the ISO image to a USB flash drive and boot it on supported hardware.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NasuaOS Latest Build
          body_path: release/release_notes.md
          prerelease: true
          make_latest: true
          files: |
            release/NasuaOS.iso
            release/NasuaOS.hdd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
